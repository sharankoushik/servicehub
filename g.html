<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFest 2026-student Registration</title>
    <link rel="icon" type="image/x-icon" href="techfest logo.jpg">
    <style>
        body{
            background-color: rgb(225, 188, 219);
        }
        form{
            background-image: url("c:\Users\koush\OneDrive\Pictures\5a80a6086e028cedf49061152a9792a3.jpg");
            background-repeat:no-repeat;
            background-size: cover;
            border-width:medium;
            border-style:solid;
            border-color:black;
        
            
        }
        
    </style>
</head>
<body>
    <form style="color:black;">
         <h1>TechFest2026-Student Registration</h1>
         <label>Student Name:</label>
         <input type="text" placeholder="enter your name">
         <br><br>
         <label>Email id:</label>
         <input type="email" placeholder="enter your email">
         <br><br>
         <label>Mobile Number:</label>
         <input type="tel" placeholder="phone number">
         <br><br>
         <label>Gender:</label>
         <input type="radio" name="Gender" value="Male" id="Male">
         <label for="Male">Male</label>
         <input type="radio" name="Gender" value="female" id="female" >
         <label for="female">female</label>
         <br><br>
         <label>department:</label>
         <select>
            <option value="1">CSE</option>
            <option value="2">ECE</option>
            <option value="3">EEE</option>
            <option value="4">MECH</option>
            <option value="5">CIVIL</option>
         </select>
         <br><br>
         <label>Year of  Study:</label>
         <select>
            <option value="1">2024-2028</option>
            <option value="2">2025-2029</option>
            <option value="3">2026-2030</option>
            <option value="4">2027-2031</option>
         </select>
         <br><br>
         <label>Events:</label>
         <br><br>
         <input type="checkbox" name="Events" value="coding context">
         <label for="">coding contest</label>
         <br><br>
         <input type="checkbox" name="Events" value="Quiz">
         <label>Quiz</label>
         <br><br>
         <input type="checkbox" name="Events" value="Web design">
         <label>Web design</label>
         <br><br>
         <input type="checkbox" name="Events" value="Project expo">
         <label>Project expo</label>
         <br><br>
         <label>Date Of Participation:</label>
         <input type="date" Name="Date Of Participation:">
         <br><br>
         <label>preferred time:</label>
         <br><br>
         <input type="Radio" name="preferred time:" value="Morning" id="Morning">
         <label for="Morning">Morning</label>
         <br><br>
         <input type="Radio" name="preferred time:" value="Afternoon" id="Afternoon">
         <label for="Afternoon">Afternoon</label>
         <br><br>
         <label>Comments:</label>
         <br><br>
         <textarea rols="5" cols="50" placeholder="Enter your requirements/comments"></textarea> 
         <br><br>
         <label>Upload ID Card:</label>
         <input type="file">
         <br><br>
         <input type="submit" value="submit form">
         <input type="reset" value="reset form">

         

    </form>
    
</body>
</html>
