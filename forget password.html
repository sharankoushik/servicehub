<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ServiceHub - Reset Password</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            background-image:
                url("67c25e80-5fd6-472f-a12e-e9a79c00327e.png");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: white;
        }


        /* DARK OVERLAY */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,0.65);

            z-index: -1;
        }


        /* HEADER */

        header {

            background: rgba(17,24,39,0.97);

            padding: 20px 7%;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        header h1 {

            color: #fbbf24;

            font-size: 30px;
        }

        header p {

            font-size: 15px;
        }


        /* MAIN */

        .container {

            width: 90%;

            max-width: 450px;

            margin: 65px auto;
        }


        /* RESET BOX */

        .reset-box {

            background: rgba(255,255,255,0.97);

            color: #222;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 8px 30px rgba(0,0,0,0.4);
        }


        .reset-box h1 {

            text-align: center;

            color: #111827;

            margin-bottom: 12px;

            font-size: 28px;
        }


        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 30px;

            line-height: 1.5;
        }


        /* INPUT GROUP */

        .input-group {

            margin-bottom: 20px;
        }


        .input-group label {

            display: block;

            font-weight: bold;

            margin-bottom: 8px;
        }


        .input-group input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }


        .input-group input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 2px rgba(37,99,235,0.1);
        }

        .input-group input:disabled {

            background: #f3f4f6;

            color: #999;
        }


        /* SEND OTP */

        .otp-btn {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-bottom: 8px;
        }


        .otp-btn:hover {

            background: #1d4ed8;
        }

        .otp-btn:disabled {

            background: #93c5fd;

            cursor: not-allowed;
        }

        .resend-note {

            text-align: center;

            font-size: 13px;

            color: #666;

            margin-bottom: 17px;
        }

        .resend-note a {

            color: #2563eb;

            font-weight: bold;

            text-decoration: none;

            cursor: pointer;
        }

        .resend-note a.disabled {

            color: #aaa;

            cursor: not-allowed;

            pointer-events: none;
        }


        /* DIVIDER */

        .divider {

            display: flex;

            align-items: center;

            gap: 10px;

            margin: 10px 0 25px;

            color: #999;
        }


        .divider::before,
        .divider::after {

            content: "";

            height: 1px;

            background: #ddd;

            flex: 1;
        }


        /* CONFIRM */

        .confirm-btn {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #16a34a;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .confirm-btn:hover {

            background: #15803d;
        }


        /* MESSAGE */

        #message {

            text-align: center;

            margin-top: 18px;

            font-weight: bold;

            display: none;

            color: #16a34a;
        }

        #message.error {

            color: #dc2626;
        }


        /* ABOUT */

        .about {

            text-align: center;

            margin-top: 35px;
        }


        .about a {

            color: #fbbf24;

            text-decoration: none;

            font-weight: bold;
        }


        /* FOOTER */

        footer {

            background: rgba(17,24,39,0.97);

            text-align: center;

            padding: 25px;

            margin-top: 50px;

            color: #d1d5db;
        }


        footer a {

            color: #fbbf24;

            text-decoration: none;
        }


        /* MOBILE */

        @media(max-width:600px) {

            header {

                flex-direction: column;

                gap: 8px;

                text-align: center;
            }

            header h1 {

                font-size: 25px;
            }

            .container {

                margin-top: 40px;
            }

            .reset-box {

                padding: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        <h1>⚡ SERVICEHUB</h1>

        <p>All Home Services At One Stop</p>

    </header>


    <!-- RESET PASSWORD -->

    <div class="container">

        <div class="reset-box">

            <h1>🔐 Reset Password</h1>

            <p class="subtitle">

                Enter your registered phone number and
                email to receive an OTP.

            </p>


            <!-- PHONE -->

            <div class="input-group">

                <label for="phone">
                    📱 Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter 10-digit phone number"
                    maxlength="10"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="input-group">

                <label for="email">
                    📧 Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                    required
                >

            </div>


            <!-- SEND OTP -->

            <button
                type="button"
                class="otp-btn"
                id="sendOtpBtn"
                onclick="sendOTP()">

                Send OTP

            </button>

            <p class="resend-note" id="resendNote"></p>


            <div class="divider">
                Enter OTP
            </div>


            <!-- OTP -->

            <div class="input-group">

                <label for="otp">
                    🔢 OTP
                </label>

                <input
                    type="text"
                    id="otp"
                    placeholder="Enter 4-digit OTP"
                    maxlength="4"
                    inputmode="numeric"
                    disabled
                >

            </div>


            <!-- CONFIRM -->

            <button
                type="button"
                class="confirm-btn"
                onclick="confirmOTP()">

                Confirm OTP ✓

            </button>


            <div id="message"></div>

        </div>


        <!-- ABOUT -->

        <div class="about">

            <h3>

                ℹ️ Know more

                <a href="more.html">
                    About Us
                </a>

            </h3>

        </div>

    </div>


    <!-- FOOTER -->

    <footer>

        <p>

            © 2026 <strong>ServiceHub</strong>.
            All Rights Reserved.

        </p>

        <p style="margin-top:10px;">

            Know more about our

            <a href="copyright.html">
                Copyright Policy
            </a>

        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script>

        // ----- OTP state (demo only — see notes below) -----
        let generatedOTP = null;
        let otpExpiresAt = null;
        let otpPhone = null;
        let resendTimer = null;
        const OTP_TTL_MS = 5 * 60 * 1000;   // 5 minutes
        const RESEND_COOLDOWN_S = 30;

        function generateOTP() {
            // 4-digit numeric OTP, zero-padded
            return String(Math.floor(Math.random() * 10000)).padStart(4, "0");
        }

        function startResendCooldown() {

            const btn = document.getElementById("sendOtpBtn");
            const note = document.getElementById("resendNote");

            let secondsLeft = RESEND_COOLDOWN_S;
            btn.disabled = true;

            clearInterval(resendTimer);

            note.textContent = `You can resend the OTP in ${secondsLeft}s`;

            resendTimer = setInterval(function () {

                secondsLeft--;

                if (secondsLeft <= 0) {

                    clearInterval(resendTimer);
                    btn.disabled = false;
                    note.textContent = "Didn't get it? You can resend now.";

                } else {

                    note.textContent = `You can resend the OTP in ${secondsLeft}s`;
                }

            }, 1000);
        }

        function sendOTP() {

            const phoneInput = document.getElementById("phone");
            const emailInput = document.getElementById("email");
            const otpInput = document.getElementById("otp");
            const message = document.getElementById("message");

            const phone = phoneInput.value.trim();
            const email = emailInput.value.trim();

            if (!/^\d{10}$/.test(phone)) {

                alert("Please enter a valid 10-digit phone number.");
                return;
            }

            if (email === "") {

                alert("Please enter your email address.");
                return;
            }

            // Generate and "store" the OTP for this attempt
            generatedOTP = generateOTP();
            otpExpiresAt = Date.now() + OTP_TTL_MS;
            otpPhone = phone;

            // ⚠️ DEMO ONLY: there's no backend/SMS gateway wired up here,
            // so the OTP can't actually reach the phone. It's surfaced
            // in an alert (and logged) purely so you can test the flow.
            // See the notes below the code for how to send it for real.
            console.log(`[DEMO] OTP for ${phone}: ${generatedOTP}`);
            alert(`(Demo mode) OTP sent to ${phone}: ${generatedOTP}\nIt expires in 5 minutes.`);

            otpInput.disabled = false;
            otpInput.value = "";
            otpInput.focus();

            message.style.display = "none";

            startResendCooldown();
        }

        function confirmOTP() {

            const otp = document.getElementById("otp").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const message = document.getElementById("message");

            message.classList.remove("error");

            if (!generatedOTP) {

                alert("Please request an OTP first.");
                return;
            }

            if (otp.length !== 4) {

                alert("Please enter a valid 4-digit OTP.");
                return;
            }

            if (phone !== otpPhone) {

                message.classList.add("error");
                message.innerHTML = "❌ Phone number changed — please resend the OTP.";
                message.style.display = "block";
                return;
            }

            if (Date.now() > otpExpiresAt) {

                message.classList.add("error");
                message.innerHTML = "⌛ OTP expired. Please resend.";
                message.style.display = "block";
                return;
            }

            if (otp !== generatedOTP) {

                message.classList.add("error");
                message.innerHTML = "❌ Incorrect OTP. Please try again.";
                message.style.display = "block";
                return;
            }

            // Success — clear it so it can't be reused
            generatedOTP = null;
            otpExpiresAt = null;

            message.innerHTML = "✅ OTP Verified Successfully!";
            message.style.display = "block";

            setTimeout(function () {

                window.location.href = "forgetpasswordrest.html";

            }, 1200);
        }

    </script>


</body>

</html>
